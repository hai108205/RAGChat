# ============================================================================
# CI Backend
# ----------------------------------------------------------------------------
# Chạy kiểm tra chất lượng cho phần backend Python (RAG pipeline, API FastAPI).
#
# Khi nào workflow chạy? (Điều kiện trigger — `on`)
#   - push  : mỗi lần commit vào nhánh `main`.
#   - pull_request: mỗi PR nhắm tới `main`.
#   - paths : CHỈ chạy khi có file trong `backend/**` bị thay đổi
#             (backend mới thay đổi mới cần chạy CI, tiết kiệm tài nguyên).
#
# LƯU Ý LỖI TRƯỚC ĐÂY:
#   Workflow từng khai báo đồng thời `paths` VÀ `paths-ignore` cho cùng sự
#   kiện. GitHub Actions KHÔNG cho phép dùng cả hai cùng lúc trên một event
#   (lỗi parse), khiến workflow bị coi là invalid và run fail ngay lập tức
#   (0s, không có job nào chạy).
#
#   Giải pháp: BỎ `paths-ignore`. Chỉ giữ `paths`, vì `backend/**` vốn đã
#   loại trừ các thay đổi nằm ngoài backend (như `.github/`, `src/`, ...).
#   Nếu sau này muốn loại trừ thêm đường dẫn nào, dùng ký tự phủ định `!`
#   trong chính `paths`, ví dụ:
#     paths:
#       - "backend/**"
#       - "!backend/README.md"
# ============================================================================
name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragchat
          POSTGRES_PASSWORD: ragchat
          POSTGRES_DB: ragchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check src/ tests/

      - name: Check formatting with Ruff
        run: |
          cd backend
          ruff format --check src/ tests/

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://ragchat:ragchat@localhost:5432/ragchat
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=60