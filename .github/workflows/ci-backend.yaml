name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
    paths-ignore:
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
    paths-ignore:
      - ".github/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragchat
          POSTGRES_PASSWORD: ragchat
          POSTGRES_DB: ragchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check src/ tests/

      - name: Check formatting with Ruff
        run: |
          cd backend
          ruff format --check src/ tests/

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://ragchat:ragchat@localhost:5432/ragchat
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=60