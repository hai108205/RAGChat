name: CI App

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "RagChatApp.ts"
      - "app.json"
      - "package.json"
      - "tsconfig.json"
      - ".rcappsconfig"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "RagChatApp.ts"
      - "app.json"
      - "package.json"
      - "tsconfig.json"
      - ".rcappsconfig"

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit
