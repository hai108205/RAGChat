name: CD

on:
  push:
    tags: ["v*"]

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ragchat-backend:${{ github.ref_name }} .

      - name: Build app image
        run: docker build -f docker/Dockerfile.app -t ragchat-app:${{ github.ref_name }} .
