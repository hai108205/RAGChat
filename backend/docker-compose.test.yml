services:
  test-db:
    image: postgres:16-alpine
    container_name: ragchat-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: docchat_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d docchat_test"]
      interval: 3s
      timeout: 3s
      retries: 5
