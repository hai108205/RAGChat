[project]
name = "ragchat-backend"
version = "0.1.0"
description = "RAGChat Python Backend — RAG pipeline with LangChain + pgVector"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.12",
    "pypdf2>=3.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.21.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
]

# ============================================================================
# LƯU Ý: Đã chuyển build-backend từ `hatchling` sang `setuptools`.
#
# Trước đây dùng hatchling và CI liên tục fail với lỗi
#   `ValueError: Unable to determine which files to ship inside the wheel`
# Mặc dù config `packages = ["src"]` đúng và build thành công khi chạy tay,
# hatchling vẫn fail trong build-isolation của pip trên GitHub Actions runner
# (không tái hiện được ở môi trường local/container) → không đáng tin cậy.
#
# Chuyển sang setuptools (backend chuẩn, ổn định, reproducible trên mọi runner)
# với `[tool.setuptools]` khai báo tường minh gói `src` để tránh mọi phỏng đoán.
# Lưu ý: import trong code chạy dạng `src.main:app` (flat package `src`).
# ============================================================================
[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

# Khai báo trực tiếp gói `src` — đặt dưới `[tool.setuptools]` (không phải
# `[tool.hatch...]`) để setuptools biết chính xác ground mà không cần phỏng đoán.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

# ============================================================================
# Cấu hình Ruff (lint + format)
# ----------------------------------------------------------------------------
# - BLE001: cho phép `except Exception` — đây là pattern chủ đích của code web
#   (API/worker) để bắt lỗi chung và trả HTTP 500 / đánh dấu job lỗi, không phải
#   sơ suất. Ruff mặc định coi đây là lỗi nên ta tắt rule này.
# - B008: FastAPI idiom hợp lệ khi dùng `Security()`, `File()` làm default
#   argument — framework yêu cầu vậy, không phải anti-pattern.
# - Ngoài ra các rule thật (F401 unused import, F841 unused var, RUF0xx, ...)
#   vẫn được giữ nguyên và CHẶN build.
# Lưu ý: bảng `[tool.ruff]` này còn khiến kết quả `ruff check` nhất quán giữa
# máy local và GitHub Actions bất kể phiên bản ruff.
# ============================================================================
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "BLE001",  # cho phép catch Exception chủ đích (web/worker error handling)
  "B008",    # FastAPI Security()/File() default args là idiom hợp lệ
]
