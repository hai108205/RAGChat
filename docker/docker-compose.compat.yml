x-compat-environment: &compat-environment
  NODE_ENV: test
  PORT: "8000"
  CORS_ORIGIN: http://localhost:3001
  CORS_METHODS: GET,POST,PUT,DELETE
  DATABASE_URL: postgresql://ragchat_compat:ragchat_compat_password@postgres-compat:5432/ragchat_compat
  REDIS_HOST: redis-compat
  REDIS_PORT: "6379"
  QDRANT_URL: http://qdrant-compat:6333
  ROCKETCHAT_INTEGRATION_TOKEN: compat-test-secret-token-12345
  ROCKETCHAT_CALLBACK_BASE_URL: http://openai-mock:8080
  ROCKETCHAT_CALLBACK_ALLOWED_ORIGINS: http://openai-mock:8080,http://localhost:8088,http://localhost:3001,http://rocketchat:3000
  ALLOW_UNAUTHENTICATED_ROCKETCHAT_DEV: "false"
  REFRESH_TOKEN_SECRET: compat-refresh-secret-min-32-chars-long
  REFRESH_TOKEN_EXPIRY: 1d
  ACCESS_TOKEN_SECRET: compat-access-secret-min-32-chars-long
  ACCESS_TOKEN_EXPIRY: 1h
  CIPHER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  ENCRYPTION_ALGORITHM: aes-256-gcm
  OPENROUTER_LLM_API_KEY: test-compat-llm-key
  OPENROUTER_EMBEDDING_API_KEY: test-compat-embedding-key
  OPENROUTER_BASE_URL: http://openai-mock:8080/v1

services:
  postgres-compat:
    image: postgres:16-alpine
    container_name: ragchat-compat-postgres
    environment:
      POSTGRES_USER: ragchat_compat
      POSTGRES_PASSWORD: ragchat_compat_password
      POSTGRES_DB: ragchat_compat
    ports:
      - "5434:5432"
    volumes:
      - pgdata-compat:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchat_compat -d ragchat_compat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ragchat-compat-network

  redis-compat:
    image: redis:7-alpine
    container_name: ragchat-compat-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata-compat:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - ragchat-compat-network

  qdrant-compat:
    image: qdrant/qdrant:v1.13.6
    container_name: ragchat-compat-qdrant
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrantdata-compat:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ragchat-compat-network

  openai-mock:
    build:
      context: ./mock-openai
      dockerfile: Dockerfile
    image: ragchat-openai-mock:local
    container_name: ragchat-compat-mock
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - ragchat-compat-network

  backend-migrate:
    image: ragchat-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ragchat-compat-migrate
    command: ["pnpm", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://ragchat_compat:ragchat_compat_password@postgres-compat:5432/ragchat_compat
    depends_on:
      postgres-compat:
        condition: service_healthy
    restart: "no"
    networks:
      - ragchat-compat-network

  backend:
    image: ragchat-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ragchat-compat-backend
    environment: *compat-environment
    ports:
      - "8008:8000"
    depends_on:
      postgres-compat:
        condition: service_healthy
      redis-compat:
        condition: service_healthy
      qdrant-compat:
        condition: service_healthy
      openai-mock:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - ragchat-compat-network

  integration-worker:
    image: ragchat-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ragchat-compat-worker
    command: ["node", "dist/workers/rocketchatIntegrationWorker.js"]
    environment:
      <<: *compat-environment
      ROCKETCHAT_WORKER_CONCURRENCY: "3"
    depends_on:
      postgres-compat:
        condition: service_healthy
      redis-compat:
        condition: service_healthy
      qdrant-compat:
        condition: service_healthy
      openai-mock:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('ioredis').createClient({host: process.env.REDIS_HOST||'localhost', port: process.env.REDIS_PORT||6379}).ping().then(()=>process.exit(0)).catch(()=>process.exit(1))\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - ragchat-compat-network

volumes:
  pgdata-compat:
    name: ragchat-compat-pgdata
  redisdata-compat:
    name: ragchat-compat-redisdata
  qdrantdata-compat:
    name: ragchat-compat-qdrantdata

networks:
  ragchat-compat-network:
    name: ragchat-compat-network
    driver: bridge
