services:
  # ──────────────────────────────────────────────────
  # PostgreSQL + pgVector
  # ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragchat-postgres
    environment:
      POSTGRES_USER: ragchat
      POSTGRES_PASSWORD: ragchat
      POSTGRES_DB: ragchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchat"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # Redis — cache + ARQ job queue
  # ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ragchat-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # MinIO — S3-compatible object storage for documents
  # ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ragchat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # Python Backend — FastAPI + LangChain RAG service
  # ──────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ragchat-backend
    env_file:
      - ../.env
    environment:
      # Host-name overrides only — the ../.env (env_file) provides the LLM,
      # storage, and auth settings below. Do NOT redeclare those here:
      # `environment` overrides `env_file`, so an interpolated empty value
      # (no OPENAI_API_KEY in compose's scope) would clobber the .env value.
      DATABASE_URL: postgresql://ragchat:ragchat@postgres:5432/ragchat
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # ARQ Worker — background document indexing
  # ──────────────────────────────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ragchat-worker
    command: arq src.taskqueue.WorkerSettings --max-jobs 10
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://ragchat:ragchat@postgres:5432/ragchat
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - async  # Only start with: docker compose --profile async up

  # ──────────────────────────────────────────────────
  # Prometheus — metrics collection
  # ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ragchat-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # Grafana — metrics dashboards
  # ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ragchat-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # MongoDB — Rocket.Chat primary database
  # ──────────────────────────────────────────────────
  mongo:
    image: mongo:5
    container_name: ragchat-mongo
    command: mongod --replSet rs0
    volumes:
      - mongodata:/data/db
    # Rocket.Chat realtime depends on MongoDB Change Streams, which require a
    # replica set (oplog). Healthcheck bootstraps a single-node replset if none
    # exists yet, so the stack comes up healthy without manual `rs.initiate()`.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try{rs.status()}catch(e){rs.initiate()&&print('replset initialized')}"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # Rocket.Chat — app host (the `src/` TypeScript app deploys here)
  # ──────────────────────────────────────────────────
  rocketchat:
    image: rocketchat/rocket.chat:6.13.0
    container_name: ragchat-rocketchat
    environment:
      MONGO_URL: mongodb://mongo:27017/rocketchat
      ROOT_URL: http://localhost:3001
      PORT: 3000
      DEPLOY_METHOD: docker
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  pgdata:
    name: ragchat-pgdata
  redisdata:
    name: ragchat-redisdata
  miniodata:
    name: ragchat-miniodata
  uploads:
    name: ragchat-uploads
  prometheusdata:
    name: ragchat-prometheusdata
  grafana-data:
    name: ragchat-grafana-data
  mongodata:
    name: ragchat-mongodata