services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragchat-postgres
    environment:
      POSTGRES_USER: ragchat
      POSTGRES_PASSWORD: ragchat
      POSTGRES_DB: ragchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchat"]
      interval: 5s
      timeout: 5s
      retries: 5

