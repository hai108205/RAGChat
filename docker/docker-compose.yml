x-backend-env-file: &backend-env-file
  - path: ../backend/.env.example
    required: true
  - path: ../backend/.env
    required: false

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: "8000"
  CORS_ORIGIN: http://localhost:3001
  CORS_METHODS: GET,POST,PUT,DELETE
  DATABASE_URL: postgresql://ragchat:ragchat@postgres:5432/ragchat
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  QDRANT_URL: http://qdrant:6333

services:
  postgres:
    image: postgres:16-alpine
    container_name: ragchat-postgres
    environment:
      POSTGRES_USER: ragchat
      POSTGRES_PASSWORD: ragchat
      POSTGRES_DB: ragchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchat -d ragchat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ragchat-network

  redis:
    image: redis:7-alpine
    container_name: ragchat-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - ragchat-network

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: ragchat-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ragchat-network

  backend-migrate:
    image: ragchat-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ragchat-backend-migrate
    command: ["pnpm", "prisma", "migrate", "deploy"]
    env_file: *backend-env-file
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - ragchat-network

  backend:
    image: ragchat-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ragchat-backend
    env_file: *backend-env-file
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - ragchat-network

  worker:
    image: ragchat-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ragchat-worker
    command: ["node", "dist/chatWorker.js"]
    env_file: *backend-env-file
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ragchat-network

  mongo:
    image: mongo:5
    container_name: ragchat-mongo
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - ragchat-network

  mongo-init:
    image: mongo:5
    container_name: ragchat-mongo-init
    command: ["/bin/bash", "/bootstrap-replset.sh"]
    volumes:
      - ./init/bootstrap-replset.sh:/bootstrap-replset.sh:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    networks:
      - ragchat-network

  rocketchat:
    image: rocketchat/rocket.chat:6.13.0
    container_name: ragchat-rocketchat
    environment:
      MONGO_URL: mongodb://mongo:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://mongo:27017/local?replicaSet=rs0
      ROOT_URL: http://localhost:3001
      PORT: "3000"
      DEPLOY_METHOD: docker
      OVERWRITE_SETTING_Show_Setup_Wizard: "completed"
    volumes:
      - rocketchat-uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - ragchat-network

volumes:
  pgdata:
    name: ragchat-postgresdata
  redisdata:
    name: ragchat-redisdata
  qdrantdata:
    name: ragchat-qdrantdata
  mongodata:
    name: ragchat-mongodata
  rocketchat-uploads:
    name: ragchat-rocketchat-uploads

networks:
  ragchat-network:
    name: ragchat-network
    driver: bridge
