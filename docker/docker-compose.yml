services:
  # ──────────────────────────────────────────────────
  # PostgreSQL + pgVector
  # ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragchat-postgres
    environment:
      POSTGRES_USER: ragchat
      POSTGRES_PASSWORD: ragchat
      POSTGRES_DB: ragchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchat"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # Redis — cache + ARQ job queue
  # ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ragchat-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # MinIO — S3-compatible object storage for documents
  # ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ragchat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # Python Backend — FastAPI + LangChain RAG service
  # ──────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ragchat-backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://ragchat:ragchat@postgres:5432/ragchat
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # ARQ Worker — background document indexing
  # ──────────────────────────────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ragchat-worker
    command: arq src.taskqueue.WorkerSettings
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://ragchat:ragchat@postgres:5432/ragchat
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # Prometheus — metrics collection
  # ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ragchat-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # Grafana — metrics dashboards
  # ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ragchat-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # MongoDB — Rocket.Chat primary database
  # ──────────────────────────────────────────────────
  mongo:
    image: mongo:5
    container_name: ragchat-mongo
    command: mongod --replSet rs0
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # ──────────────────────────────────────────────────
  # Mongo Init — one-shot replica set bootstrap
  # Runs after mongo is healthy, bootstraps rs0 via shell script, waits for
  # primary election, then exits cleanly. Keeps mongo's default entrypoint intact.
  # ──────────────────────────────────────────────────
  mongo-init:
    image: mongo:5
    container_name: ragchat-mongo-init
    command: ["/bin/bash", "/bootstrap-replset.sh"]
    volumes:
      - ./init/bootstrap-replset.sh:/bootstrap-replset.sh:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  # ──────────────────────────────────────────────────
  # Rocket.Chat — app host (the `src/` TypeScript app deploys here)
  # ──────────────────────────────────────────────────
  rocketchat:
    image: rocketchat/rocket.chat:6.13.0
    container_name: ragchat-rocketchat
    environment:
      MONGO_URL: mongodb://mongo:27017/rocketchat?replicaSet=rs0
      ROOT_URL: http://localhost:3001
      PORT: 3000
      DEPLOY_METHOD: docker
      MONGO_OPLOG_URL: mongodb://mongo:27017/local?replicaSet=rs0
      OVERWRITE_SETTING_Show_Setup_Wizard: "completed"
    volumes:
      - rocketchat-uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  pgdata:
    name: ragchat-pgdata
  redisdata:
    name: ragchat-redisdata
  miniodata:
    name: ragchat-miniodata
  uploads:
    name: ragchat-uploads
  rocketchat-uploads:
    name: ragchat-rocketchat-uploads
  prometheusdata:
    name: ragchat-prometheusdata
  grafana-data:
    name: ragchat-grafana-data
  mongodata:
    name: ragchat-mongodata
